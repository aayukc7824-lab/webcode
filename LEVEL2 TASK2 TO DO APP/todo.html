<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App - Level 2 Task 2</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .todo-container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 500px;
            margin: 0 auto;
        }

        .todo-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .todo-input-group input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: #f4f6f7;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            transition: background 0.2s;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .todo-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-complete {
            background: #2ecc71;
            color: white;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">To-Do App</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="todo.html" class="active">To-Do App</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="todo-container">
            <h1>My To-Do List</h1>
            <p>Manage your daily tasks efficiently. Data is saved locally in your browser.</p>
            
            <div class="todo-input-group">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addTaskBtn" class="btn">Add Task</button>
            </div>

            <ul id="taskList" class="todo-list">
                <!-- Dynamic tasks will populate here -->
            </ul>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 To-Do List App. All rights reserved.</p>
    </footer>

    <!-- JavaScript Logic for To-Do App -->
    <script>
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        // Load tasks from Local Storage on startup
        document.addEventListener('DOMContentLoaded', loadTasks);

        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === "") return;

            const taskObj = { text: taskText, completed: false };
            
            createTaskElement(taskObj);
            saveTaskToLocalStorage(taskObj);

            taskInput.value = "";
        }

        function createTaskElement(taskObj) {
            const li = document.createElement('li');
            li.className = `todo-item ${taskObj.completed ? 'completed' : ''}`;

            const span = document.createElement('span');
            span.textContent = taskObj.text;

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'todo-actions';

            const completeBtn = document.createElement('button');
            completeBtn.textContent = taskObj.completed ? 'Undo' : 'Complete';
            completeBtn.className = 'btn-small btn-complete';
            completeBtn.onclick = function() {
                li.classList.toggle('completed');
                taskObj.completed = !taskObj.completed;
                completeBtn.textContent = taskObj.completed ? 'Undo' : 'Complete';
                updateLocalStorage();
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'btn-small btn-delete';
            deleteBtn.onclick = function() {
                li.remove();
                deleteTaskFromStorage(taskObj.text);
            };

            actionsDiv.appendChild(completeBtn);
            actionsDiv.appendChild(deleteBtn);

            li.appendChild(span);
            li.appendChild(actionsDiv);
            taskList.appendChild(li);
        }

        function getTasksFromLocalStorage() {
            let tasks = localStorage.getItem('tasks');
            return tasks ? JSON.parse(tasks) : [];
        }

        function saveTaskToLocalStorage(taskObj) {
            let tasks = getTasksFromLocalStorage();
            tasks.push(taskObj);
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            let tasks = getTasksFromLocalStorage();
            tasks.forEach(task => createTaskElement(task));
        }

        function updateLocalStorage() {
            const items = document.querySelectorAll('.todo-item');
            let tasks = [];
            items.forEach(item => {
                tasks.push({
                    text: item.querySelector('span').textContent,
                    completed: item.classList.contains('completed')
                });
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function deleteTaskFromStorage(taskText) {
            let tasks = getTasksFromLocalStorage();
            tasks = tasks.filter(task => task.text !== taskText);
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }
    </script>

</body>
</html>
